<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Arrange Circuit Tiles</title>
    <link rel="stylesheet" href="circuit.css">
  </head>
  <body>
    <main>
      <h1>Arrange Circuit Tiles</h1>
      <p>Drag each tile from the tray into a space on the board.</p>

      <section class="board" aria-label="2 by 2 circuit board">
        <div class="board-slot" data-slot="top-left" aria-label="Top-left space">
          <div class="slot-rotation-controls">
            <button type="button" class="rotate-button" data-rotate="counterclockwise" aria-label="Rotate tile in top-left space counterclockwise"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19 11a7 7 0 0 0-13-3M6 4v4h4"/></svg></button>
            <button type="button" class="rotate-button" data-rotate="clockwise" aria-label="Rotate tile in top-left space clockwise"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 11a7 7 0 0 1 13-3M18 4v4h-4"/></svg></button>
          </div>
          <span class="slot-hint">Drop a tile here</span>
        </div>
        <div class="board-slot" data-slot="top-right" aria-label="Top-right space">
          <div class="slot-rotation-controls">
            <button type="button" class="rotate-button" data-rotate="counterclockwise" aria-label="Rotate tile in top-right space counterclockwise"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19 11a7 7 0 0 0-13-3M6 4v4h4"/></svg></button>
            <button type="button" class="rotate-button" data-rotate="clockwise" aria-label="Rotate tile in top-right space clockwise"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 11a7 7 0 0 1 13-3M18 4v4h-4"/></svg></button>
          </div>
          <span class="slot-hint">Drop a tile here</span>
        </div>
        <div class="board-slot" data-slot="bottom-left" aria-label="Bottom-left space">
          <div class="slot-rotation-controls">
            <button type="button" class="rotate-button" data-rotate="counterclockwise" aria-label="Rotate tile in bottom-left space counterclockwise"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19 11a7 7 0 0 0-13-3M6 4v4h4"/></svg></button>
            <button type="button" class="rotate-button" data-rotate="clockwise" aria-label="Rotate tile in bottom-left space clockwise"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 11a7 7 0 0 1 13-3M18 4v4h-4"/></svg></button>
          </div>
          <span class="slot-hint">Drop a tile here</span>
        </div>
        <div class="board-slot" data-slot="bottom-right" aria-label="Bottom-right space">
          <div class="slot-rotation-controls">
            <button type="button" class="rotate-button" data-rotate="counterclockwise" aria-label="Rotate tile in bottom-right space counterclockwise"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19 11a7 7 0 0 0-13-3M6 4v4h4"/></svg></button>
            <button type="button" class="rotate-button" data-rotate="clockwise" aria-label="Rotate tile in bottom-right space clockwise"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 11a7 7 0 0 1 13-3M18 4v4h-4"/></svg></button>
          </div>
          <span class="slot-hint">Drop a tile here</span>
        </div>
      </section>

      <p id="status" aria-live="polite">Tiles in tray: battery, LED, resistor, bent wire.</p>

      <section class="tile-tray" id="tile-tray" aria-label="Tile tray">
        <div class="tile" id="battery" data-tile="battery" draggable="true" aria-label="Battery tile">
          <img src="../svg/battery.svg" alt="">
          <span>Battery</span>
        </div>
        <div class="tile" id="led" data-tile="led" draggable="true" aria-label="LED tile">
          <img src="../svg/led.svg" alt="">
          <span>LED</span>
        </div>
        <div class="tile" id="resistor" data-tile="resistor" draggable="true" aria-label="Resistor tile">
          <img src="../svg/resistor-edge.svg" alt="">
          <span>Resistor</span>
        </div>
        <div class="tile" id="bent-wire" data-tile="bent wire" draggable="true" aria-label="Bent wire tile">
          <img src="../svg/bent_wire.svg" alt="">
          <span>Bent wire</span>
        </div>
      </section>

    </main>

    <script src="circuit.js"></script>
  </body>
</html>
